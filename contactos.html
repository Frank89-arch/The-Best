<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Contactos | The Best</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo-text">The <span>Best</span></a>
    </div>
  </header>

  <main style="max-width: var(--max-width); margin: 8rem auto; padding: 0 2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;">
    <div>
      <h1 style="font-family: var(--font-heading); color: var(--color-gold); font-size: 2.5rem; margin-bottom: 1.5rem;">Fale Connosco</h1>
      <p style="color:#aaa; margin-bottom: 2rem;">Atendimento exclusivo directo pelo WhatsApp ou redes sociais.</p>
      <p><i class="fab fa-whatsapp" style="color:var(--color-gold);"></i> +258 84 000 0000</p>
      <p style="margin: 0.5rem 0;"><i class="fas fa-envelope" style="color:var(--color-gold);"></i> contacto@thebest.com</p>
    </div>

    <form style="background: var(--color-dark-gray); padding: 2rem; display:flex; flex-direction:column; gap:1rem;" onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!');">
      <input type="text" placeholder="Nome" class="newsletter-input" required>
      <input type="email" placeholder="E-mail" class="newsletter-input" required>
      <textarea rows="4" placeholder="Sua Mensagem" class="newsletter-input" required></textarea>
      <button type="submit" class="btn-primary">Enviar Mensagem</button>
    </form>
  </main>
</body>
</html>
