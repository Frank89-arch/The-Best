<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Best | Produto</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/responsive.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="overlay" id="overlay"></div>

<header class="header">

<div class="header-container">

<a href="index.html" class="logo">

<img src="img/Logo/img/Logo.png" alt="The Best">

</a>

<nav class="nav-menu" id="nav-menu">

<a href="index.html">Início</a>

<a href="produtos.html">Colecção</a>

<a href="sobre.html">Sobre</a>

<a href="contactos.html">Contactos</a>

</nav>

<div class="header-actions">

<button class="icon-btn" id="cart-btn">

<i class="fas fa-shopping-bag"></i>

<span class="badge cart-badge">0</span>

</button>

</div>

</div>

</header>

<main class="product-page">

<div class="product-container">

<div class="product-gallery">

<img
id="product-image"
class="main-image"
src=""
alt="Produto">

<div
id="product-thumbnails"
class="thumbnails">

</div>

</div>

<div class="product-info">

<span
id="product-category"
class="product-category">

</span>

<h1
id="product-name">

</h1>

<div
id="product-price"
class="product-price">

</div>

<p
id="product-description">

</p>

<div class="product-meta">

<p>

<strong>Material:</strong>

<span id="product-material"></span>

</p>

<p>

<strong>Colecção:</strong>

<span id="product-collection"></span>

</p>

<p>

<strong>Stock:</strong>

<span id="product-stock"></span>

</p>

</div>

<div class="sizes">

<h3>

Escolha o tamanho

</h3>

<div
id="sizes-container">

</div>

</div>

<div class="quantity">

<h3>

Quantidade

</h3>

<div class="qty-box">

<button id="qty-minus">

−

</button>

<span id="qty-value">

1

</span>

<button id="qty-plus">

+

</button>

</div>

</div>

<div class="product-buttons">

<button
id="add-cart-btn"
class="btn-primary">

Adicionar ao Carrinho

</button>

<button
id="buy-whatsapp-btn"
class="btn-secondary">

Comprar pelo WhatsApp

</button>

</div>

</div>

</div>

<section class="related-products">

<h2>

Também poderá gostar

</h2>

<div
id="related-products"
class="products-grid">

</div>

</section>

</main>

<script src="js/prices.js"></script>

<script src="js/products.js"></script>

<script src="js/cart.js"></script>

<script src="js/whatsapp.js"></script>

<script src="js/main.js"></script>

<script src="js/modal.js"></script>

<script src="js/product-page.js"></script>

</body>

</html>
