<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <title>Admin Demo | The Best</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-container {
      max-width: 1000px;
      margin: 6rem auto;
      padding: 2rem;
      background: var(--color-dark-gray);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }

    .table th,
    .table td {
      padding: 1rem;
      border-bottom: 1px solid #333;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="admin-layout">

    <!-- MENU LATERAL -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <img src="img/Logo/img/Logo.png" alt="The Best">

            <h2>THE BEST</h2>

        </div>

        <nav class="sidebar-menu">

            <button class="menu-item active" data-page="dashboard">

                <i class="fas fa-chart-line"></i>

                Dashboard

            </button>

            <button class="menu-item" data-page="products">

                <i class="fas fa-box"></i>

                Produtos

            </button>

            <button class="menu-item" data-page="categories">

                <i class="fas fa-tags"></i>

                Categorias

            </button>

            <button class="menu-item" data-page="orders">

                <i class="fas fa-shopping-cart"></i>

                Encomendas

            </button>

            <button class="menu-item" data-page="marketing">

                <i class="fas fa-bullhorn"></i>

                Marketing

            </button>

            <button class="menu-item" data-page="settings">

                <i class="fas fa-cog"></i>

                Configurações

            </button>

        </nav>

        <div class="sidebar-bottom">

            <button id="logout-btn" class="btn-primary">

                <i class="fas fa-sign-out-alt"></i>

                Terminar Sessão

            </button>

        </div>

    </aside>

    <!-- ÁREA PRINCIPAL -->

    <main class="admin-main">

        <header class="topbar">

            <div>

                <h1 id="page-title">

                    Dashboard

                </h1>

                <p>

                    Bem-vindo ao painel administrativo da The Best.

                </p>

            </div>

            <button id="add-product-btn" class="btn-primary">

                <i class="fas fa-plus"></i>

                Novo Produto

            </button>

        </header>

        <!-- DASHBOARD -->

        <section id="dashboard-page" class="page active-page">

            <div class="dashboard-cards">

                <div class="dashboard-card">

                    <h2 id="total-products">0</h2>

                    <span>Produtos</span>

                </div>

                <div class="dashboard-card">

                    <h2 id="total-categories">0</h2>

                    <span>Categorias</span>

                </div>

                <div class="dashboard-card">

                    <h2 id="total-stock">0</h2>

                    <span>Stock</span>

                </div>

                <div class="dashboard-card">

                    <h2 id="new-products">0</h2>

                    <span>Novos</span>

                </div>

            </div>

        </section>

        <!-- PRODUTOS -->

        <section id="products-page" class="page">

            <div class="toolbar">

                <input

                id="admin-search"

                type="text"

                placeholder="Pesquisar produtos...">

                <select id="admin-category">

                    <option value="all">

                        Todas as categorias

                    </option>

                </select>

            </div>

            <table class="table">

                <thead>

                    <tr>

                        <th>Imagem</th>

                        <th>Produto</th>

                        <th>Categoria</th>

                        <th>Preço</th>

                        <th>Stock</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="admin-table">

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="js/products.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-dashboard.js"></script>
<script src="js/admin-products.js"></script>
<script src="js/admin-storage.js"></script>
<script src="js/admin-ui.js"></script>
<script src="js/admin.js"></script>

<div id="edit-modal" class="admin-modal">

    <div class="admin-modal-content">

        <div class="modal-header">

            <h2 id="modal-title">Novo Produto</h2>

            <button id="close-edit-modal" class="close-modal">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="modal-grid">

            <div>

                <label>Código</label>

                <input id="edit-id" type="text">

            </div>

            <div>

                <label>Nome</label>

                <input id="edit-name" type="text">

            </div>

            <div>

                <label>Categoria</label>

                <input id="edit-category" type="text">

            </div>

            <div>

                <label>Preço</label>

                <input id="edit-price" type="number">

            </div>

            <div>

                <label>Stock</label>

                <input id="edit-stock" type="number">

            </div>

            <div>

                <label>Material</label>

                <input id="edit-material" type="text">

            </div>

        </div>

        <label>Descrição</label>

        <textarea id="edit-description"></textarea>

        <label>Imagem</label>

        <input
            id="edit-image"
            type="text"
            placeholder="img/Produtos/...">

        <div class="modal-actions">

            <button
                id="cancel-product"
                class="btn-secondary">

                Cancelar

            </button>

            <button
                id="save-product"
                class="btn-primary">

                Guardar

            </button>

        </div>

    </div>

</div>
</body>

</html>
