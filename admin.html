<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <title>Admin Demo | The Best</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-container {
      max-width: 1000px;
      margin: 6rem auto;
      padding: 2rem;
      background: var(--color-dark-gray);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }

    .table th,
    .table td {
      padding: 1rem;
      border-bottom: 1px solid #333;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="admin-container">

<div class="admin-header">

<div>

<h1>Painel Administrativo</h1>

<p>Gestão completa da loja The Best</p>

</div>

<div class="admin-header-actions">

<button id="add-product-btn" class="btn-primary">

<i class="fas fa-plus"></i>

Adicionar Produto

</button>

<button id="logout-btn" class="btn-secondary">

<i class="fas fa-sign-out-alt"></i>

Sair

</button>

</div>

</div>

<div class="dashboard-cards">

<div class="dashboard-card">

<h3 id="total-products">0</h3>

<p>Produtos</p>

</div>

<div class="dashboard-card">

<h3 id="total-categories">0</h3>

<p>Categorias</p>

</div>

<div class="dashboard-card">

<h3 id="total-stock">0</h3>

<p>Stock</p>

</div>

<div class="dashboard-card">

<h3 id="new-products">0</h3>

<p>Novos</p>

</div>

</div>

<div class="admin-toolbar">

<input
type="text"
id="admin-search"
placeholder="Pesquisar produto...">

<select id="admin-category">

<option value="all">

Todas as categorias

</option>

</select>

</div>

<table class="table">

<thead>

<tr>

<th>Imagem</th>

<th>Nome</th>

<th>Categoria</th>

<th>Preço</th>

<th>Stock</th>

<th>Ações</th>

</tr>

</thead>

<tbody id="admin-table">

</tbody>

</table>

</div>



<button
onclick="AdminProducts.open(ProductsManager.getById('${p.id}'))"
style="background:none;color:var(--color-gold);cursor:pointer;margin-right:10px;">

<i class="fas fa-edit"></i>

Editar

</button>

<button
style="background:none;color:#e74c3c;cursor:pointer;">

<i class="fas fa-trash"></i>

Eliminar

</button>

</td>
        </tr>
      </thead>

    </table>
  </div>

<script src="js/products.js"></script>

<script src="js/admin-dashboard.js"></script>

<script src="js/admin-products.js"></script>

<script src="js/admin-auth.js"></script>

<script>
   document.addEventListener('DOMContentLoaded', async () => {

    await ProductsManager.init();

    AdminDashboard.update();

    renderAdminProducts();

    document
        .getElementById("logout-btn")
        .addEventListener("click", logout);

});
  </script>


<div id="edit-modal" class="admin-modal">

    <div class="admin-modal-content">

        <span id="close-edit-modal" class="close-modal">&times;</span>

        <h2>Editar Produto</h2>

        <input type="hidden" id="edit-id">

        <label>Nome</label>
        <input type="text" id="edit-name">

        <label>Categoria</label>
        <input type="text" id="edit-category">

        <label>Preço</label>
        <input type="number" id="edit-price">

        <label>Stock</label>
        <input type="number" id="edit-stock">

        <label>Descrição</label>
        <textarea id="edit-description"></textarea>

        <button id="save-product" class="btn-primary">

            Guardar Alterações

        </button>

    </div>

</div>
</body>

</html>
