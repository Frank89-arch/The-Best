<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | The Best Admin</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

background:#000;

padding:20px;

}

.login-box{

width:100%;

max-width:420px;

background:var(--color-dark-gray);

padding:40px;

border-radius:15px;

text-align:center;

box-shadow:0 0 30px rgba(0,0,0,.4);

}

.login-logo{

font-family:var(--font-heading);

font-size:3rem;

color:var(--color-gold);

margin-bottom:10px;

}

.login-box p{

color:#999;

margin-bottom:35px;

}

.login-box input{

width:100%;

padding:14px;

margin-bottom:18px;

background:#111;

border:1px solid #333;

color:#fff;

border-radius:8px;

font-size:1rem;

}

.login-box input:focus{

outline:none;

border-color:var(--color-gold);

}

#error{

color:#ff5c5c;

margin-top:15px;

display:none;

}

</style>

</head>

<body>

<div class="login-box">

<div class="login-logo">

THE BEST

</div>

<p>

Área Administrativa

</p>

<form id="login-form">

<input
type="text"
id="username"
placeholder="Utilizador"
required>

<input
type="password"
id="password"
placeholder="Palavra-passe"
required>

<button
type="submit"
class="btn-primary"
style="width:100%;">

Entrar

</button>

</form>

<p id="error">

Utilizador ou palavra-passe incorrectos.

</p>

</div>

<script src="js/admin-auth.js"></script>

<script>

document
.getElementById("login-form")
.addEventListener("submit",function(e){

e.preventDefault();

const ok=login(

document.getElementById("username").value,

document.getElementById("password").value

);

if(!ok){

document.getElementById("error").style.display="block";

}

});

</script>

</body>

</html>
